<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal | Khaled bin Alwaleed School</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#14161c; --ink-soft:#3d4150; --muted:#767b8c; --line:#e7e8ef; --line-strong:#c7c9d6;
  --paper:#fff; --surface:#f6f7fb; --accent:#3452e0; --accent-soft:#ecefff;
  --correct:#1f8a4c; --correct-bg:#e9f7ef; --incorrect:#d13b3b; --incorrect-bg:#fdecec;
  --serif:'Newsreader',serif; --sans:'Inter',sans-serif; --arabic-h:'Noto Kufi Arabic',sans-serif;
  --arabic-b:'Noto Sans Arabic',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:12px; --shadow:0 1px 2px rgba(20,22,28,.04), 0 6px 20px rgba(20,22,28,.05);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
.arabic{font-family:var(--arabic-b);direction:rtl;}
.site-header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px clamp(16px,5vw,56px);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.hdr-left{display:flex;flex-direction:column;gap:2px;}
.hdr-left .sch{font-size:12px;color:var(--muted);}
.hdr-left h1{font-family:var(--serif);font-size:23px;margin:0;font-weight:700;}
.hdr-right{display:flex;align-items:center;gap:14px;}
.hdr-right .name{font-size:13.5px;color:var(--ink-soft);font-weight:600;}
.hdr-right button{font-family:inherit;font-size:12.5px;background:none;border:1px solid var(--line-strong);
  border-radius:20px;padding:7px 15px;cursor:pointer;transition:.15s;}
.hdr-right button:hover{background:var(--surface);}
main{max-width:920px;margin:0 auto;padding:26px clamp(16px,5vw,56px) 90px;}
.progress-strip{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.progress-card{flex:1;min-width:120px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;}
.progress-card .n{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--accent);}
.progress-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.chapter-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 12px;padding-left:2px;}
.chapter-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;}
.chapter-cover{position:relative;height:120px;background-size:cover;background-position:center;display:flex;align-items:flex-end;overflow:hidden;}
.chapter-cover-num{position:absolute;right:14px;top:-6px;font-family:var(--serif);font-size:96px;font-weight:700;color:rgba(255,255,255,.18);line-height:1;}
.chapter-cover-overlay{position:relative;z-index:1;padding:14px 18px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);width:100%;}
.chapter-cover-title{font-family:var(--serif);font-size:19px;font-weight:700;color:#fff;}
.chapter-cover-title-ar{font-family:var(--arabic-h);font-size:13.5px;color:rgba(255,255,255,.85);direction:rtl;margin-top:2px;}
.lessons-grid{padding:14px;display:flex;flex-direction:column;gap:10px;}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.lesson-head{display:flex;align-items:center;gap:16px;width:100%;background:none;border:none;cursor:pointer;
  padding:18px 20px;text-align:left;font:inherit;color:inherit;transition:.15s;}
.lesson-head:hover{background:var(--accent-soft);}
.lesson-num{font-family:var(--serif);font-size:15px;color:#fff;background:var(--accent);width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;}
.lesson-titles{flex:1;min-width:0;}
.lesson-title-en{font-family:var(--serif);font-size:17px;font-weight:700;}
.lesson-title-ar{font-family:var(--arabic-h);font-size:13.5px;color:var(--muted);direction:rtl;margin-top:2px;}
.lesson-meta{flex:none;display:flex;align-items:center;gap:12px;}
.score{font-family:var(--mono);font-size:12px;padding:4px 11px;border:1px solid var(--line-strong);border-radius:20px;font-weight:600;}
.score.complete{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);transition:transform .25s;}
.lesson.open .chev{transform:rotate(-135deg);}
.lesson-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.lesson-body-inner{padding:0 20px 28px;background:var(--paper);}
.guide{background:var(--accent-soft);border-radius:9px;padding:16px 18px;margin-bottom:16px;}
.guide-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:8px;}
.guide-en{font-size:13.5px;line-height:1.6;}
.guide-ar{font-family:var(--arabic-b);font-size:13px;line-height:1.85;direction:rtl;text-align:right;
  color:var(--ink-soft);margin-top:9px;border-top:1px dashed rgba(52,82,224,.25);padding-top:9px;}
.outcomes{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 18px;margin-bottom:16px;}
.outcomes-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;}
.outcome-line{display:flex;align-items:flex-start;gap:9px;font-size:13px;margin-bottom:7px;}
.outcome-line:last-child{margin-bottom:0;}
.outcome-check{width:16px;height:16px;flex:none;margin-top:1px;border-radius:5px;border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;}
.outcome-check::after{content:'✓';color:var(--accent);font-size:11px;font-weight:700;}
.resources{margin-bottom:16px;}
.res-card{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;position:relative;}
.res-title{padding:10px 14px;font-size:13px;font-weight:600;background:var(--surface);border-bottom:1px solid var(--line);}
.video-wrap{position:relative;padding-top:56.25%;background:#000;}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.watermark{position:absolute;inset:0;pointer-events:none;display:flex;flex-wrap:wrap;align-content:space-around;
  justify-content:space-around;opacity:.32;overflow:hidden;}
.watermark span{color:#fff;font-size:13px;font-weight:600;transform:rotate(-28deg);white-space:nowrap;
  text-shadow:0 0 3px rgba(0,0,0,.6);}
.worksheet-link{display:block;padding:12px 14px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;}
.worksheet-link:hover{background:var(--surface);}
.worksheet-note{font-size:11px;color:var(--muted);padding:0 14px 10px;}
.qgrid{display:flex;flex-direction:column;gap:12px;}
.qcard{border:1px solid var(--line);border-radius:9px;padding:16px 18px 18px;transition:.15s;}
.qcard.answered.correct{border-color:var(--correct);background:linear-gradient(180deg,var(--correct-bg),transparent 40%);}
.qcard.answered.incorrect{border-color:var(--incorrect);background:linear-gradient(180deg,var(--incorrect-bg),transparent 40%);}
.qtext{font-family:var(--mono);font-size:14.5px;font-weight:500;margin-bottom:4px;}
.qtext-ar{font-family:var(--arabic-b);font-size:12.5px;color:var(--muted);direction:rtl;text-align:right;margin-bottom:10px;}
.qimg{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);margin:10px 0;display:block;}
.choices{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;}
.choices .choice{flex:1 1 calc(50% - 5px);min-width:160px;}
.choice{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line-strong);border-radius:8px;
  background:var(--paper);padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:13.5px;text-align:left;transition:.12s;}
.choice:hover{border-color:var(--accent);}
.choice .mark{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);position:relative;}
.qcard.answered .choice{cursor:default;pointer-events:none;}
.qcard.answered .choice:not(.is-correct):not(.is-picked){opacity:.45;}
.choice.is-correct{border-color:var(--correct);background:var(--correct-bg);}
.choice.is-correct .mark{border-color:var(--correct);background:var(--correct);}
.choice.is-picked.is-wrong{border-color:var(--incorrect);background:var(--incorrect-bg);}
.choice.is-picked.is-wrong .mark{border-color:var(--incorrect);background:var(--incorrect);}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
.pw-gate{position:fixed;inset:0;background:rgba(20,22,28,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.pw-card{background:#fff;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.3);padding:32px;max-width:380px;width:100%;}
.pw-card h2{font-family:var(--serif);font-size:20px;margin:0 0 8px;}
.pw-card p{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5;}
.pw-card input{width:100%;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:7px;font-size:14px;margin-bottom:12px;font-family:inherit;}
.pw-card button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;}
.pw-err{color:var(--incorrect);font-size:12.5px;margin-bottom:10px;display:none;}
.explain{margin-top:10px;padding:10px 12px;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--ink-soft);display:none;}
.explain.show{display:block;}
</style>
</head>
<body>
<header class="site-header">
  <div class="hdr-left">
    <span class="sch">Khaled bin Alwaleed School — Student Portal</span>
    <h1>Polynomials</h1>
  </div>
  <div class="hdr-right">
    <span class="name" id="studentName"></span>
    <button id="logoutBtn">Sign Out</button>
  </div>
</header>
<main>
  <div class="progress-strip" id="progressStrip"></div>
  <div id="main"><div class="loading">Loading…</div></div>
</main>

<div class="pw-gate" id="pwGate" style="display:none;">
  <div class="pw-card">
    <h2>Set a New Password</h2>
    <p>For your security, please set your own password before continuing.</p>
    <div class="pw-err" id="pwErr"></div>
    <input type="password" id="pwNew" placeholder="New password (min 6 characters)">
    <input type="password" id="pwConfirm" placeholder="Confirm new password">
    <button id="pwSaveBtn">Save Password</button>
  </div>
</div>

<script src="config.js"></script>
<script src="student.js"></script>
</body>
</html>
